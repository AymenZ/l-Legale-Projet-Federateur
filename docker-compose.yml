# ==============================================================================
# I-Légale — docker-compose.yml (développement)
# ==============================================================================
# Démarrer      : docker compose up -d
# Statut        : docker compose ps          (attendu : "healthy")
# Logs          : docker compose logs -f database
# Arrêter       : docker compose down
# Purger données: docker compose down -v     (réexécute les scripts d'init)
# Prérequis     : cp .env.example .env
# ==============================================================================

services:
  # PostgreSQL 16 + extension pgvector (corpus RAG du Code du travail)
  database:
    image: pgvector/pgvector:pg16
    container_name: federateur_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-federateur_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts exécutés dans l'ordre alphabétique, uniquement au 1er démarrage
      # (volume vide). 00 = extensions, 01 = schéma. seed.sql reste manuel.
      - ./database/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-federateur_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend_network

  # Administration web de la base : http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: federateur_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend_network

volumes:
  postgres_data:
    name: federateur_postgres_data

networks:
  backend_network:
    name: federateur_network
    driver: bridge
